        :root {
            --bg-color: #0a0f1d;
            --card-bg: #111827;
            --card-border: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --tag-bg: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem 1rem;
            overflow-x: hidden;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Hero Entry Animations */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Header / Hero */
        header {
            text-align: center;
            padding: 3rem 0 2rem;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 3rem;
            animation: fadeInDown 1s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .hero-nav {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
        }

        .hero-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease, transform 0.2s ease;
            display: inline-block;
        }

        .hero-nav a:hover {
            color: var(--accent-cyan);
            transform: translateY(-2px);
        }

        /* Section Reveal Styles */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* Section Titles */
        .section-title {
            font-size: 1.75rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--text-main);
        }

        .section-title i {
            color: var(--accent-blue);
        }

        section {
            margin-bottom: 4rem;
        }

        /* Background Section */
        .background-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 2rem;
            transition: box-shadow 0.3s ease;
        }

        .background-card:hover {
            box-shadow: 0 10px 25px -5px rgba(6, 182, 212, 0.1);
        }

        .background-card p {
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-size: 1.05rem;
        }

        .background-card p:last-child {
            margin-bottom: 0;
        }

        .highlight {
            color: var(--accent-cyan);
            font-weight: 600;
        }

            gap: 1.5rem;
        }

        .skill-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.8rem;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .skill-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-cyan);
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.15);
        }

        .skill-card h3 {
            color: var(--accent-cyan);
            margin-bottom: 1rem;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .skill-card ul {
            list-style: none;
        }

        .skill-card li {

            margin-bottom: 0.6rem;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .skill-card li i {
            color: var(--accent-blue);
            font-size: 0.8rem;
        }
