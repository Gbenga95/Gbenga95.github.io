<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --bg-color: #0a0f1d;
            --card-bg: #111827;
            --card-border: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent-blue: #3b82f6;
            --accent-cyan: #06b6d4;
            --accent-yellow: #f59e0b;
            --tag-bg: #1e293b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem 1rem;
            overflow-x: hidden;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            padding: 3rem 0 2rem;
            border-bottom: 1px solid var(--card-border);
            margin-bottom: 3rem;
            animation: fadeInDown 1s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .hero-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .hero-nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease, transform 0.2s ease;
        }

        .hero-nav a:hover {
            color: var(--accent-cyan);
            transform: translateY(-2px);
        }

        .cv-btn {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-cyan));
            color: #ffffff !important;
            padding: 0.5rem 1.2rem;
            border-radius: 6px;
            font-weight: 600 !important;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.2);
        }

        .cv-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0);
        }

        .section-title {
            font-size: 1.75rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            color: var(--text-main);
        }

        .section-title i {
            color: var(--accent-blue);
        }

        section {
            margin-bottom: 4rem;
        }

        .background-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 2rem;
        }

        .background-card p {
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-size: 1.05rem;
        }

        .highlight {
            color: var(--accent-cyan);
            font-weight: 600;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .skill-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 1.8rem;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .skill-card:hover {
            transform: translateY(-6px);
            border-color: var(--accent-cyan);

        .skill-card li {

            align-items: center;
            gap: 0.5rem;

        .skill-card li i {
            color: var(--accent-blue);
            font-size: 0.8rem;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        .project-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 2rem;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-blue);
        }

            justify-content: space-between;

            margin-bottom: 1rem;
        }

        .project-title {

            color: #ffffff;

        }

        .project-link {
            color: var(--accent-cyan);
            text-decoration: none;
            font-size: 0.9rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;

        }

        .project-desc {

        }

        .impact-statement {

            font-size: 0.95rem;
            margin-bottom: 1.2rem;
            font-weight: 500;
        }

        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .tag {
            background-color: var(--tag-bg);
            color: #60a5fa;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            border: 1px solid rgba(96, 165, 250, 0.2);
        }

        .contact-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 2.5rem;
            text-align: center;
        }

        .contact-card p {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .contact-grid {

            justify-content: center;
            flex-wrap: wrap;
            gap: 1.5rem;
        }
